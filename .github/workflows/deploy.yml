name: Publikacja strony

# Jedyny workflow, który publikuje tę stronę. Nie dodawaj drugiego — dwa
# pipeline'y pchające do GitHub Pages ścigają się i wygrywa ten, który
# akurat skończy później.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Generowanie stron z recipes.json
        run: python generate_site.py

      - name: Konfiguracja gita
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Budowa i publikacja
        run: mkdocs gh-deploy --force
