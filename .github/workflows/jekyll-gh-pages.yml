# WYŁĄCZONE — ten plik można skasować.
#
# Ten workflow budował katalog główny repozytorium Jekyllem i publikował wynik
# do GitHub Pages równolegle z „Publikacja strony” (deploy.yml). Oba kończyły
# się sukcesem, a to, co widział użytkownik, zależało od tego, który skończył
# ostatni. Strona jest budowana MkDocs-em, więc wersja Jekylla nigdy nie była
# tą właściwą.
#
# Zostawiony jako pusty workflow uruchamiany wyłącznie ręcznie, żeby nic już
# nie startował automatycznie. Bezpiecznie usuń cały plik.

name: (wyłączone) Jekyll

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Ten workflow nic nie robi
        run: echo "Strona jest publikowana przez .github/workflows/deploy.yml"
