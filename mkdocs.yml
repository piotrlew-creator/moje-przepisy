site_name: Przepisy Dietetyczne
site_description: Baza przepisów z przelicznikiem porcji i interaktywną listą zakupów

theme:
  name: material
  language: pl
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.instant
    - navigation.top

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/main.js

nav:
  - Strona Główna: index.md
  - Przepisy:
    - Wszystkie: index.md