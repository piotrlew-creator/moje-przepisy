site_name: Gotuj z Lewym
site_description: Przepisy z Twojego planu diety — z przelicznikiem porcji, listą zakupów i trybem gotowania krok po kroku.
site_author: Piotr Lewandowski
site_url: https://piotrlew-creator.github.io/moje-przepisy/
repo_url: https://github.com/piotrlew-creator/moje-przepisy
edit_uri: ""

theme:
  name: material
  language: pl
  # Kroje pisma leżą w docs/fonts/ i wpina je stylesheets/fonts.css. Bez tego
  # Material dociąga jeszcze Roboto z fonts.googleapis.com — żądanie blokujące
  # renderowanie po font, którego strona i tak nie używa.
  font: false
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny
  features:
    # Świadomie BEZ navigation.instant — strony przepisów wnoszą własne
    # skrypty inicjujące, a podmiana treści bez przeładowania potrafi je
    # pominąć.
    - navigation.top
    - navigation.tabs
    - search.suggest
    - search.highlight
  # Garnek z parą zamiast domyślnej książki Material — strona jest o gotowaniu,
  # nie o dokumentacji. Ta sama ikona siedzi w favicon.svg.
  icon:
    logo: material/pot-steam
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/app.js

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: false

plugins:
  # lunr nie ma słownika polskiego (Material sam zgłasza fallback), więc nie
  # ustawiamy `lang` — wyszukiwarka i tak indeksuje polskie słowa dosłownie.
  - search

# Strony przepisów są celowo poza menu: wchodzi się do nich z wyszukiwarki
# i z planu dnia. Bez tej listy MkDocs zgłaszałby je jako „osierocone”.
not_in_nav: |
  przepisy/*.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/piotrlew-creator/moje-przepisy

nav:
  - Przepisy: index.md
  - Zakupy: zakupy.md
